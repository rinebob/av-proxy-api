
<div class="stock-data-container">
  <button (click)="toggleFunction()">Toggle function</button>
  <p>Using function: {{functionToUse()}}</p>
  <form [formGroup]="stockForm" (ngSubmit)="onSubmit()" class="stock-form">
    <div>
      <label for="ticker">Ticker Symbol:</label>
      <input id="ticker" type="text" formControlName="tickerSymbol">
    </div>
    <button type="submit">Get Stock Data</button>
  </form>

</div>

<p>Stock Data:</p>
<p>{{stockData | json}}</p>
