<div class="stock-data-container">
  <mat-card class="stock-card">
    <mat-card-header>
      <mat-card-title>Stock Data Lookup</mat-card-title>
      <mat-card-subtitle>
        {{ currentFunction().displayName }}
      </mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="stockForm" (ngSubmit)="onSubmit()" class="stock-form">
        <div class="function-toggle">
          <button 
            mat-stroked-button 
            (click)="toggleFunction()" 
            matTooltip="Toggle between Daily and Quote data"
            type="button"
            [disabled]="stockForm.disabled"
            class="toggle-button">
            <mat-icon>swap_horiz</mat-icon>
            <span>
              @switch (currentFunction()) {
                @case (StockDataFunctions.DAILY_STOCK_DATA) {
                  Switch to {{ StockDataFunctions.GLOBAL_QUOTE.displayName }}
                }
                @case (StockDataFunctions.GLOBAL_QUOTE) {
                  Switch to {{ StockDataFunctions.DAILY_STOCK_DATA.displayName }}
                }
              }
            </span>
          </button>
        </div>
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Stock Ticker Symbol</mat-label>
          <input 
            matInput 
            id="ticker" 
            type="text" 
            formControlName="tickerSymbol" 
            placeholder="e.g. AAPL" 
            required>
        </mat-form-field>

        <div class="button-container">
          <button 
            mat-raised-button 
            color="primary" 
            type="submit" 
            [disabled]="!stockForm.valid || !stockForm.get('tickerSymbol')?.value"
            class="submit-button">
            <span class="button-content">
              @if (isLoading) {
                <mat-spinner diameter="20"></mat-spinner>
                <span>Loading...</span>
              } @else {
                <mat-icon>search</mat-icon>
                <span>{{ currentFunction().buttonText }}</span>
              }
            </span>
          </button>
        </div>
      </form>

      @if (errorMessage) {
        <div class="error-message" [class.rate-limit-error]="errorMessage.includes('API rate limit')">
          <mat-icon color="warn">error_outline</mat-icon>
          <div class="error-content">
            <div class="error-title">
              @if (errorMessage.includes('API rate limit')) {
                <span>Rate Limit Reached</span>
              } @else {
                <span>Error</span>
              }
            </div>
            <div class="error-details">{{ errorMessage }}</div>
          </div>
        </div>
      }

      @if (stockData) {
        <div class="stock-results">
          <mat-divider></mat-divider>
          <h3>Results:</h3>
          <pre>{{ stockData | json }}</pre>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
