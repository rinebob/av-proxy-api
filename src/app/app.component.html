<div class="app-container">
  <mat-toolbar color="primary" class="app-toolbar">
    <button mat-icon-button (click)="sidenav.toggle()" class="menu-button">
      <mat-icon>menu</mat-icon>
    </button>
    
    <span class="logo" routerLink="/admin">Savant API</span>
    
    <span class="spacer"></span>
    
    <app-manual-firestore-write-toggle />
    
    @if (isAuthenticated()) {
      <div class="user-info">
        <span class="welcome-text">Welcome, {{ currentUser()?.email || 'User' }}</span>
        <button mat-raised-button color="accent" (click)="handleLogout()" class="logout-button">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </div>
    } @else {
      <button mat-button routerLink="/login" class="login-button">
        <mat-icon>login</mat-icon>
        <span>Login</span>
      </button>
    }
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container" autosize>
    <mat-sidenav #sidenav class="sidenav" mode="side">
      <mat-nav-list>
        @for (item of filteredNavItems(); track item.route) {
          <a mat-list-item 
             [routerLink]="item.route" 
             routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: item.exact}"
             (click)="sidenav.toggle()"
             class="nav-item">
            <mat-icon matListItemIcon class="nav-icon">{{item.iconName}}</mat-icon>
            <span matListItemTitle class="nav-label">{{item.displayName}}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="content">
      <main class="main-content">
        <router-outlet></router-outlet>
      </main>

      <footer class="footer">
        <div class="container">
          <span> 2025 Savant API. All rights reserved.</span>
        </div>
      </footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
