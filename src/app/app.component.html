<div class="app-container">
  <mat-toolbar color="primary">
    <span class="logo" routerLink="/stock-data">AV Proxy API</span>
    
    <nav class="nav-links" *ngIf="currentUser()">
      <a mat-button 
         routerLink="/stock-data" 
         routerLinkActive="active" 
         [routerLinkActiveOptions]="{exact: true}">
        <mat-icon>show_chart</mat-icon>
        <span>Stock Data</span>
      </a>
      <a mat-button 
         routerLink="/calendars" 
         routerLinkActive="active">
        <mat-icon>event</mat-icon>
        <span>Calendars</span>
      </a>
      <a mat-button 
         routerLink="/logos" 
         routerLinkActive="active">
        <mat-icon>image</mat-icon>
        <span>Company Logos</span>
      </a>
    </nav>
    
    <span class="spacer"></span>
    
    @if (currentUser(); as user) {
      <div class="user-info">
        <span class="welcome-text">Welcome, {{ user.email || 'User' }}</span>
        <button mat-raised-button color="accent" (click)="handleLogout()" class="logout-button">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </div>
    } @else {
      <button mat-button routerLink="/login" class="login-button">
        <mat-icon>login</mat-icon>
        <span>Login</span>
      </button>
    }
  </mat-toolbar>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <div class="container">
      <span> 2025 AV Proxy API. All rights reserved.</span>
    </div>
  </footer>
</div>
