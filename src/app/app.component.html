<div class="app-container">
  <mat-toolbar color="primary">
    <span class="logo" routerLink="/admin">Savant API</span>
    
    @if (currentUser()) {
      <nav class="nav-links">
        <a mat-button 
           routerLink="/admin" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{exact: true}">
          <mat-icon>show_chart</mat-icon>
          <span>Admin</span>
        </a>
        <a mat-button 
           routerLink="/calendars" 
           routerLinkActive="active">
          <mat-icon>event</mat-icon>
          <span>Calendars</span>
        </a>
        <a mat-button 
           routerLink="/data-maintainer" 
           routerLinkActive="active">
          <mat-icon>storage</mat-icon>
          <span>Data Maintainer</span>
        </a>
        <a mat-button 
           routerLink="/symbol-manager" 
           routerLinkActive="active">
          <mat-icon>list_alt</mat-icon>
          <span>Symbol Manager</span>
        </a>
        <a mat-button 
           routerLink="/logos" 
           routerLinkActive="active">
          <mat-icon>image</mat-icon>
          <span>Company Logos</span>
        </a>
        @if (isAdmin()) {
          <a mat-button 
             routerLink="/fs-debug" 
             routerLinkActive="active">
            <mat-icon>bug_report</mat-icon>
            <span>Debug</span>
          </a>
        }
      </nav>
    }
    
    <span class="spacer"></span>
    
    @if (currentUser(); as user) {
      <div class="user-info">
        <span class="welcome-text">Welcome, {{ user.email || 'User' }}</span>
        <button mat-raised-button color="accent" (click)="handleLogout()" class="logout-button">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </div>
    } @else {
      <button mat-button routerLink="/login" class="login-button">
        <mat-icon>login</mat-icon>
        <span>Login</span>
      </button>
    }
  </mat-toolbar>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <div class="container">
      <span> 2025 Savant API. All rights reserved.</span>
    </div>
  </footer>
</div>
