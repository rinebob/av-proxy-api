<div class="app-container">
  <mat-toolbar color="primary">
    <span class="logo" routerLink="/admin">Savant API</span>
    
    @if (isAuthenticated()) {
      <nav class="nav-links">
        @for (item of filteredNavItems(); track item.route) {
          <a mat-button 
             [routerLink]="item.route" 
             routerLinkActive="active" 
             [routerLinkActiveOptions]="{exact: item.exact}"
             [matTooltip]="item.tooltip"
             matTooltipPosition="below">
            <mat-icon>{{item.iconName}}</mat-icon>
            <span>{{item.displayName}}</span>
          </a>
        }
      </nav>
    }
    
    <span class="spacer"></span>
    
    @if (isAuthenticated()) {
      <div class="user-info">
        <span class="welcome-text">Welcome, {{ currentUser()?.email || 'User' }}</span>
        <button mat-raised-button color="accent" (click)="handleLogout()" class="logout-button">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </div>
    } @else {
      <button mat-button routerLink="/login" class="login-button">
        <mat-icon>login</mat-icon>
        <span>Login</span>
      </button>
    }
  </mat-toolbar>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <div class="container">
      <span> 2025 Savant API. All rights reserved.</span>
    </div>
  </footer>
</div>
