<section class="storage-viewer">
  <header class="header">
    <div class="title">
      <h1>Storage File Viewer</h1>
      <p class="subtitle">Browse and read GCS files from the options time-series and corpus buckets</p>
    </div>

    <!-- Find Bar -->
    <div class="find-bar">
    <mat-form-field appearance="outline" class="find-input">
      <mat-label>Find</mat-label>
      <input
        matInput
        [value]="searchTerm()"
        (input)="onSearchInput($any($event.target).value)"
        placeholder="Search in both viewers…"
      />
    </mat-form-field>

    <div class="nav-group">
      <span class="nav-label">Corpus</span>
      <button
        mat-icon-button
        (click)="onCorpusPrev()"
        [disabled]="corpusNoMatches()"
        matTooltip="Previous corpus match"
      >
        <mat-icon fontIcon="arrow_upward"></mat-icon>
      </button>
      <span class="nav-count">{{ corpusCurrent() }}/{{ corpusTotal() }}</span>
      <button
        mat-icon-button
        (click)="onCorpusNext()"
        [disabled]="corpusNoMatches()"
        matTooltip="Next corpus match"
      >
        <mat-icon fontIcon="arrow_downward"></mat-icon>
      </button>
    </div>

    <div class="nav-group">
      <span class="nav-label">TS</span>
      <button
        mat-icon-button
        (click)="onTsPrev()"
        [disabled]="tsNoMatches()"
        matTooltip="Previous time-series match"
      >
        <mat-icon fontIcon="arrow_upward"></mat-icon>
      </button>
      <span class="nav-count">{{ tsCurrent() }}/{{ tsTotal() }}</span>
      <button
        mat-icon-button
        (click)="onTsNext()"
        [disabled]="tsNoMatches()"
        matTooltip="Next time-series match"
      >
        <mat-icon fontIcon="arrow_downward"></mat-icon>
      </button>
    </div>
    </div>
  </header>

  <!-- Dual-column layout -->
  <div class="columns-row">
    <div class="column corpus-column">
      <app-corpus-viewer />
    </div>
    <div class="column ts-column">
      <app-time-series-viewer />
    </div>
  </div>
</section>
