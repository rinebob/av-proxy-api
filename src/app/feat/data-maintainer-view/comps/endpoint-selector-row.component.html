<div class="endpoint-row">
  @for (endpoint of endpoints; track endpoint.key) {
    <button 
      type="button"
      class="endpoint-btn"
      [class.selected]="dataMaintainerStore.endpoint() === endpoint.key"
      [disabled]="endpoint.disabled"
      (click)="selectEndpoint(endpoint.key)">
      {{ endpoint.label }}
    </button>
  }
</div>
