<div class="request-log-table">
  <div class="table-header">
    <h3 class="heading">Request Logs</h3>
  </div>
  <table class="table" aria-label="Health request logs table">
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Endpoint</th>
        <th>Symbol</th>
        <th>Status</th>
        <th>Duration (ms)</th>
        <th>Error</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="6" class="empty">Logs will appear here.</td>
      </tr>
    </tbody>
  </table>
</div>
