<section class="health-dashboard">
    <header class="header">
        <div class="title">
            <h1 class="title">Health Metrics Dashboard</h1>
            <p class="subtitle">System health, endpoint status, and request logs</p>

        </div>
        <div class="summary-header">
            <div class="header-actions">
                <button class="mat-compact-btn" mat-stroked-button color="primary" (click)="healthStore.loadSummary()">
                    <mat-icon fontIcon="sync"></mat-icon>
                    Summary
                </button>
                <button class="mat-compact-btn" mat-stroked-button color="primary" (click)="healthStore.loadLogs()">
                    <mat-icon fontIcon="sync"></mat-icon>
                    Logs
                </button>
                <span class="last-updated" aria-label="Last updated">
                    <span class="label">Last updated:</span>
                    <span class="value">{{ healthStore.summary()?.lastUpdated | tsToIso:'local' }}</span>
                </span>
            </div>
        </div>
    </header>

    <div class="content">
        <app-health-summary-cards />

        <app-health-filters-bar />

        <!-- DO NOT DELETE - DEBUG -->
        <!-- <div class="debug" aria-hidden="true" style="margin: 0.5rem 0; color: #888; font-size: 0.85rem;">
            Tab: {{ healthStore.activeTabIndex() }} • Symbol: {{ healthStore.selectedSymbol() || '—' }}
        </div> -->

        <mat-tab-group animationDuration="200ms" fitInkBarToContent mat-align-tabs="start" mat-stretch-tabs="false"
                       [selectedIndex]="healthStore.activeTabIndex()" (selectedIndexChange)="healthStore.setActiveTab($event)">
            <mat-tab label="Endpoint Detail">
                <app-health-endpoint-detail />
            </mat-tab>
            <mat-tab label="Symbol Detail">
                <app-health-symbol-drawer />
            </mat-tab>
            <mat-tab label="Request Logs">
                <ng-template matTabContent>
                    <app-health-request-log-table />
                </ng-template>
            </mat-tab>
        </mat-tab-group>
    </div>
</section>
