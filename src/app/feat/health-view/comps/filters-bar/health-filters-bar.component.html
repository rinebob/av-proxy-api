<div class="filters-bar" role="region" aria-label="Health filters">
  <div class="top">
    <span class="title">Filters</span>
    <div class="actions">
      <button type="button" class="btn" (click)="healthStore.loadSummary()">Refresh Summary</button>
      <button type="button" class="btn" (click)="healthStore.loadLogs()">Refresh Logs</button>
    </div>
  </div>

  <form class="controls" (submit)="$event.preventDefault(); applyFilters(endpointsSel, symbolsSel, from.value, to.value, sortBy.value, sortOrder.value)">
    <!-- Endpoint ID dropdown -->
    <label class="field">
      <span>Endpoints</span>
      <select #endpointsSel>
        <option value="">(any)</option>
        @for (ep of endpointsList; track ep) {
          <option [value]="ep">{{ ep }}</option>
        }
      </select>
    </label>

    <!-- Symbol dropdown -->
    <label class="field">
      <span>Symbols</span>
      <select #symbolsSel>
        <option value="">(any)</option>
        @for (sym of symbolsList(); track sym) {
          <option [value]="sym">{{ sym }}</option>
        }
      </select>
    </label>

    <!-- Date Range -->
    <label class="field">
      <span>From</span>
      <input #from type="datetime-local" />
    </label>
    <label class="field">
      <span>To</span>
      <input #to type="datetime-local" />
    </label>

    <!-- Sorting -->
    <label class="field">
      <span>Sort By</span>
      <select #sortBy>
        <option value="timestamp" selected>timestamp</option>
        <option value="symbol">symbol</option>
        <option value="endpointId">endpointId</option>
      </select>
    </label>
    <label class="field">
      <span>Order</span>
      <select #sortOrder>
        <option value="desc" selected>desc</option>
        <option value="asc">asc</option>
      </select>
    </label>

    <div class="field buttons">
      <button type="submit" class="btn primary">Apply</button>
      <button type="button" class="btn" (click)="clearFilters(endpointsSel, symbolsSel, from, to, sortBy, sortOrder)">Clear</button>
    </div>
  </form>

  <div class="raw">
    <h4>Current Filters (raw)</h4>
    <pre>{{ healthStore.filters() | json }}</pre>
  </div>
</div>
