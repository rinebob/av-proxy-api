<div class="endpoint-toggle-row">
  <mat-button-toggle-group
  [value]="selectedEndpoint()"
  (change)="onEndpointChange($event.value)"
  aria-label="Calendar Type"
>
  @for (endpoint of bzCalendarEndpoints; track endpoint) {
      <mat-button-toggle [value]="endpoint">{{ calendarTypeMetadataMap[endpoint].displayName }}</mat-button-toggle>
  }
</mat-button-toggle-group>
</div>
