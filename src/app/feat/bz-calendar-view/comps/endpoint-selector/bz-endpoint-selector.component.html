<div class="endpoint-toggle-row">
  <mat-button-toggle-group
  [value]="selectedEndpoint()"
  (change)="onEndpointChange($event.value)"
  aria-label="Calendar Type"
>
  @for (type of calendarTypes; track type) {
    <mat-button-toggle [value]="type">{{ calendarTypeMetadataMap[type].displayName }}</mat-button-toggle>
  }
</mat-button-toggle-group>
</div>
