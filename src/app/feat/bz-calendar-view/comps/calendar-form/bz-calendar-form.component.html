<form class="form-row input-row" [formGroup]="searchForm">
  <div class="form-fields">
    <mat-form-field appearance="outline" class="ticker-field">
      <mat-label>Ticker Symbol</mat-label>
      <input matInput formControlName="ticker" placeholder="e.g. NVDA">
    </mat-form-field>

    <mat-form-field appearance="outline" class="date-field">
      <mat-label>Start Date</mat-label>
      <input matInput [matDatepicker]="startPicker" formControlName="startDate">
      <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="date-field">
      <mat-label>End Date</mat-label>
      <input matInput [matDatepicker]="endPicker" formControlName="endDate" [min]="searchForm.get('startDate')?.value">
      <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
    </mat-form-field>
  </div>
  <div class="form-actions">
    <button mat-raised-button color="primary" type="submit">
      <mat-icon>search</mat-icon>
      Search
    </button>
  </div>
</form>

<!-- Placeholder for dynamic form content -->
<div class="dynamic-content-placeholder">
  @if (searchForm.get('calendarType')?.value; as value) {
    <span>Selected Calendar: <strong>{{ value | titlecase }}</strong></span>
  } @else {
    <span>Select a calendar type above</span>
  }
</div>
