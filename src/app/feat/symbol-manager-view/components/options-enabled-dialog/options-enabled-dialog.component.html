<h2 mat-dialog-title>{{ data.enabled ? 'Enable' : 'Disable' }} options corpus</h2>
<mat-dialog-content>
  @if (data.enabled) {
    <p>Enable the options corpus pipeline for <strong>{{ data.symbol }}</strong>? Historical options data will be fetched and swing sets generated.</p>
  } @else {
    <p>Disable the options corpus pipeline for <strong>{{ data.symbol }}</strong>?</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()">Cancel</button>
  <button mat-button color="primary" (click)="onConfirm()" cdkFocusInitial>
    {{ data.enabled ? 'Enable' : 'Disable' }}
  </button>
</mat-dialog-actions>
